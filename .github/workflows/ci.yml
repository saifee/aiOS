name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: leadhunter, POSTGRES_PASSWORD: leadhunter, POSTGRES_DB: leadhunter }
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm -w packages/db run generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test
        env:
          DATABASE_URL: postgresql://leadhunter:leadhunter@localhost:5432/leadhunter
          REDIS_URL: redis://localhost:6379
  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/ai/requirements.txt
      - run: python -m pytest services/ai/tests -q || true
  docker:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
