name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm -w packages/db run generate
      - name: Build all packages
        run: npm run build
      - name: Run tests
        run: npm run test

  python-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai      # scoring.py lives here — tests import it directly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI service deps
        run: pip install -r requirements.txt
      - name: Run AI service tests
        run: python -m pytest tests -q
