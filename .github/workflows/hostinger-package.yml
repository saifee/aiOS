name: Build Hostinger package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build kingslee-aios-hostinger.zip
        run: ./scripts/package-hostinger.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kingslee-aios-hostinger
          path: kingslee-aios-hostinger.zip
