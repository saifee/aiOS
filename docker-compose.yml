version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadhunter
      POSTGRES_PASSWORD: leadhunter
      POSTGRES_DB: leadhunter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U leadhunter"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio123 }
    ports: ["9000:9000", "9001:9001"]

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment: { DATABASE_URL: "postgresql://leadhunter:leadhunter@postgres:5432/leadhunter", REDIS_URL: "redis://redis:6379" }
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  workers:
    build: { context: ., dockerfile: infra/docker/workers.Dockerfile }
    env_file: .env
    environment: { DATABASE_URL: "postgresql://leadhunter:leadhunter@postgres:5432/leadhunter", REDIS_URL: "redis://redis:6379", AI_SERVICE_URL: "http://ai:8000" }
    depends_on: [api, ai]

  ai:
    build: { context: ./services/ai }
    env_file: .env
    ports: ["8000:8000"]

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:4000" }
    ports: ["3000:3000"]
    depends_on: [api]

  voice:
    build: { context: ., dockerfile: services/voice/Dockerfile }
    env_file: .env
    environment: { DATABASE_URL: "postgresql://leadhunter:leadhunter@postgres:5432/leadhunter" }
    ports: ["5050:5050"]
    depends_on: [postgres]

volumes:
  pgdata:
