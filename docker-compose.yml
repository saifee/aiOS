# Kingslee AIOS — local stack for Docker Desktop
#   docker compose up -d --build        -> app at http://localhost:4000
#   docker compose --profile voice up -d --build   (adds the phone-call bridge)
services:
  db:
    image: mariadb:10.11                 # same engine family as Hostinger
    environment:
      MARIADB_ROOT_PASSWORD: leadhunter-root
      MARIADB_DATABASE: leadhunter
      MARIADB_USER: leadhunter
      MARIADB_PASSWORD: leadhunter
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:                                    # API + web UI together
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: mysql://leadhunter:leadhunter@db:3306/leadhunter
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  workers:
    build: { context: ., dockerfile: infra/docker/workers.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: mysql://leadhunter:leadhunter@db:3306/leadhunter
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }

  voice:
    profiles: ["voice"]
    build: { context: ., dockerfile: services/voice/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: mysql://leadhunter:leadhunter@db:3306/leadhunter
    ports: ["5050:5050"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  dbdata:
