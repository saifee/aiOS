# Kingslee AIOS — local stack for Docker Desktop
#   docker compose up -d --build        -> app at http://localhost:4000
#   docker compose --profile voice up -d --build   (adds the phone-call bridge)
services:
  postgres:
    image: pgvector/pgvector:pg16        # Postgres 16 with the vector extension
    environment:
      POSTGRES_USER: leadhunter
      POSTGRES_PASSWORD: leadhunter
      POSTGRES_DB: leadhunter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadhunter"]
      interval: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:                                    # API + web UI together
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leadhunter:leadhunter@postgres:5432/leadhunter
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  workers:
    build: { context: ., dockerfile: infra/docker/workers.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leadhunter:leadhunter@postgres:5432/leadhunter
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }

  voice:
    profiles: ["voice"]
    build: { context: ., dockerfile: services/voice/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://leadhunter:leadhunter@postgres:5432/leadhunter
    ports: ["5050:5050"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
